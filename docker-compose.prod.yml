# Production stack: runs ONLY the web app and points it at a managed database
# (Supabase). There is no local postgres container here — set the DB_* values
# in a .env file next to this one (see .env.example "Production (Supabase)").
#
# Usage on the server:
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  web:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped
